<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1F14" />
    <meta name="description" content="FertoBot - Smart Agriculture Monitoring System with IoT sensors for optimal crop management" />
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="FertoBot">
    <meta name="msapplication-TileColor" content="#1976d2">
    <meta name="msapplication-tap-highlight" content="no">
    
    <!-- Google Fonts — Deep Earth Nexus -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Figtree:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Figtree:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
    <style>
      :root {
        --nexus-bg: #060C08;
        --nexus-surface: #0A1410;
        --nexus-elevated: #0F1C14;
        --nexus-accent: #A8FF3E;
        --nexus-teal: #00E5C6;
        --nexus-amber: #FFB830;
        --nexus-red: #FF4565;
        --nexus-blue: #4DA8FF;
        --nexus-text: #D8EDE0;
        --nexus-muted: #4A6E55;
        --nexus-border: rgba(168,255,62,0.07);
        --nexus-border-strong: rgba(168,255,62,0.18);
        --nexus-glow: rgba(168,255,62,0.12);
      }
      * { box-sizing: border-box; }
      body { background: var(--nexus-bg); }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.7); }
      }
      @keyframes scan-line {
        0% { transform: translateY(-100%); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(800px); opacity: 0; }
      }
      @keyframes fade-up {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes glow-pulse {
        0%, 100% { box-shadow: 0 0 8px rgba(168,255,62,0.2); }
        50% { box-shadow: 0 0 20px rgba(168,255,62,0.45); }
      }
      .nexus-card { animation: fade-up 0.4s ease both; }
      .nexus-card:nth-child(1) { animation-delay: 0.05s; }
      .nexus-card:nth-child(2) { animation-delay: 0.1s; }
      .nexus-card:nth-child(3) { animation-delay: 0.15s; }
      .nexus-card:nth-child(4) { animation-delay: 0.2s; }
      .nexus-card:nth-child(5) { animation-delay: 0.25s; }
    </style>
    
    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/images/32-2.ico" />
    <link rel="icon" type="image/svg+xml" href="/images/fertobot-icon.svg" />
    <link rel="apple-touch-icon" href="/images/512 (1).ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/icon-16x16.png">
    <link rel="manifest" href="/manifest.json" />
    
    <title>FertoBot - Smart Agriculture Monitor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
